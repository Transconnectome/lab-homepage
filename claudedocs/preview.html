<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connectome Lab Production Astro Redesign (Option E: Quiet Intellectual)</title>
  <style>
    :root {
      --bg: #FAF9F6;
      --ink: #1C1917;
      --ink-soft: #44403C;
      --accent: #801818;
      --line: #E7E5E4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #F0ECE4;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 32px 20px;
    }
    .wrapper {
      max-width: 1400px;
      margin: 0 auto;
    }
    header {
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 24px 32px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      color: var(--ink);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-family: monospace;
      background: #E8F5E9;
      color: #2E7D32;
      padding: 4px 12px;
      border-radius: 999px;
      font-weight: 600;
    }
    .tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    .tab-btn {
      background: white;
      border: 1px solid var(--line);
      color: var(--ink-soft);
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .view-card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    .view-card img {
      width: 100%;
      height: auto;
      border: 1px solid var(--line);
      border-radius: 4px;
      display: block;
      margin: 0 auto;
    }
    .mobile-frame {
      max-width: 420px;
      margin: 0 auto;
      border: 8px solid #2D2D2D;
      border-radius: 36px;
      overflow: hidden;
      background: var(--bg);
      box-shadow: 0 10px 40px rgba(0,0,0,0.25);
    }
    .mobile-frame img {
      border: none;
      border-radius: 0;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header>
      <div>
        <h1>Connectome Lab — Option E (The Editorial Monograph / Quiet Intellectual)</h1>
        <p style="font-size: 13px; color: var(--ink-soft); margin-top: 4px;">
          Production Astro Codebase Applied · 100% Tests & Contracts Passing
        </p>
      </div>
      <div class="status-badge">✓ 16/16 Pages & Zero Overflow Pass</div>
    </header>

    <div class="tabs">
      <button class="tab-btn active" onclick="showView('desktop')">Desktop (1440px) Full Monograph</button>
      <button class="tab-btn" onclick="showView('mobile')">Mobile (390px iPhone View)</button>
      <button class="tab-btn" onclick="showView('hero')">Hero Close-up (Desktop)</button>
    </div>

    <div id="view-desktop" class="view-card">
      <img src="screenshots/desktop_ko_full.png" alt="Desktop Korean Full Monograph">
    </div>

    <div id="view-mobile" class="view-card" style="display: none; background: transparent; border: none; box-shadow: none;">
      <div class="mobile-frame">
        <img src="screenshots/mobile_ko_full.png" alt="Mobile Korean Full Monograph">
      </div>
    </div>

    <div id="view-hero" class="view-card" style="display: none;">
      <img src="screenshots/desktop_ko_hero.png" alt="Desktop Hero Close-up">
    </div>
  </div>

  <script>
    function showView(type) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');

      document.getElementById('view-desktop').style.display = type === 'desktop' ? 'block' : 'none';
      document.getElementById('view-mobile').style.display = type === 'mobile' ? 'block' : 'none';
      document.getElementById('view-hero').style.display = type === 'hero' ? 'block' : 'none';
    }
  </script>
</body>
</html>
