name: Draft News from Issue

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read

concurrency:
  group: news-draft-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  draft:
    name: Generate news files for review
    if: >-
      github.repository == 'Transconnectome/lab-homepage' &&
      contains(github.event.issue.labels.*.name, 'news-submission') &&
      (
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) ||
        contains(github.event.issue.labels.*.name, 'approved')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Test draft validation
        run: python3 scripts/test_news_from_issue.py
      - name: Generate bilingual draft
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 scripts/news_from_issue.py
      - name: Save drafts for human review
        uses: actions/upload-artifact@v4
        with:
          name: news-draft-${{ github.event.issue.number }}
          path: .news-drafts/*.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Review instructions
        run: |
          printf '%s\n' '## News draft ready' 'Download the news-draft artifact above. Review facts, names, dates, links, and both languages. Apply approved Markdown files to src/content/news/ on main, run npm test and npm run build, then push. This workflow does not publish or close the submission.' >> "$GITHUB_STEP_SUMMARY"
