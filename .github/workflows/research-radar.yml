name: Auto-Sync Research Trends & Publications

on:
  schedule:
    # Every Monday 00:00 UTC (09:00 KST)
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: research-radar
  cancel-in-progress: false

jobs:
  sync:
    name: Sync, validate, commit, deploy
    # Guard: never run the scheduled sync on forks
    if: github.repository == 'Transconnectome/lab-homepage'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Scholar Sync
        run: python scripts/sync_scholar.py

      - name: Run SOTA Research Radar Sync
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/update_research_radar.py

      - name: Generate AI Research Ideas
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/generate_research_ideas.py

      # Validation gate: never commit generated content that breaks the build.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (validates generated content against Zod schemas)
        run: npm run build

      - name: Commit & push changes
        id: commit
        run: |
          git config --global user.name 'Connectome Lab Bot'
          git config --global user.email 'bot@connectomelab.com'
          git add src/content/
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new publications or trends found."
          else
            git commit -m "chore(radar): automated weekly research trends & publications update"
            git pull --rebase origin main
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with GITHUB_TOKEN does not trigger deploy.yml, so deploy
      # the freshly built site from this workflow when content changed.
      - name: Upload GitHub Pages artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
