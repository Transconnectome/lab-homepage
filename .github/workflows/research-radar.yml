name: Auto-Sync Research Trends & Publications

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    name: Sync and deploy validated main
    if: github.repository == 'Transconnectome/lab-homepage'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Test generators
        run: |
          python3 scripts/test_radar_buckets.py
          python3 scripts/test_ideas_pipeline.py
      - name: Sync publications
        run: python3 scripts/sync_scholar.py
      - name: Scan research radar
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 scripts/update_research_radar.py
      - name: Generate labeled AI ideas
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 scripts/generate_research_ideas.py
      - name: Refresh project metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_project_metadata.py
      - name: Commit generated records and integrate latest main locally
        id: commit
        run: |
          git config user.name 'Connectome Lab Bot'
          git config user.email 'bot@connectomelab.com'
          git add src/content/publications/ src/content/trends/ src/content/ideas/ src/content/projects/
          if git diff --staged --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m 'chore(radar): refresh research trends and publications'
            git pull --rebase origin main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v6
        if: steps.commit.outputs.changed == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      # Validate the final rebased tree. Push rejection stops deployment.
      - name: Validate final tree
        if: steps.commit.outputs.changed == 'true'
        run: |
          npm ci
          npm test
          npm run build
          npm run test:site
          git push origin HEAD:main
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true'
        with:
          path: ./dist
      - uses: actions/deploy-pages@v4
        if: steps.commit.outputs.changed == 'true'
        id: deployment
