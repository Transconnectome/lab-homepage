name: "📰 뉴스 제출 (News submission)"
description: "연구실 소식을 제출하면 AI가 영문·국문 초안을 작성합니다. 검토 후 관리자가 게시합니다."
title: "[News] "
labels: ["news-submission"]
body:
  - type: markdown
    attributes:
      value: |
        연구실 소식(논문 게재, 수상, 학회 발표, 행사, 전시 등)을 알려주세요.
        AI가 제공된 내용을 바탕으로 영문·국문 **검토용 초안**을 작성합니다.
        관리자가 사실과 공개 여부를 확인한 뒤 게시합니다. 제출 즉시 홈페이지에 공개되지는 않습니다.
        이 저장소의 이슈는 공개됩니다. 공개 가능한 내용만 적어 주세요.

  - type: input
    id: headline
    attributes:
      label: "한 줄 요약 (What happened?)"
      description: "예: 홍길동 학생 논문이 NeurIPS 2026에 게재 승인"
      placeholder: "무슨 일이 있었나요?"
    validations:
      required: true

  - type: input
    id: date
    attributes:
      label: "날짜 (Date, YYYY-MM-DD)"
      placeholder: "2026-08-21"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: "분류 (Category)"
      options:
        - paper
        - award
        - conference
        - event
        - exhibition
        - general
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: "자세한 내용 (Details)"
      description: "누가, 무엇을, 어디서, 왜 중요한지. 이름·논문 제목·학회명·수상명 등은 정확하게 적어주세요. 여기 적힌 사실만 기사에 들어갑니다."
      placeholder: |
        - 관련된 사람: (예: 홍길동 대학원생, 차지욱 교수)
        - 논문/수상/행사 이름:
        - 배경이나 의미:
    validations:
      required: true

  - type: input
    id: link
    attributes:
      label: "관련 링크 (Link, optional)"
      description: "논문 DOI, 학회 페이지, 기사 URL 등"
      placeholder: "https://..."
    validations:
      required: false
